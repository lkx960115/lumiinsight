# 本机若已有其它容器占用端口，只改宿主机映射，容器内端口不变。
# 截图环境：mysql:5.7 已占 3306，minio 在 19001。灯鉴必须用独立 MySQL 8，禁止复用 5.7。

services:
  mysql:
    image: mysql:8.0.40
    container_name: lumi-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lumiinsight
      MYSQL_USER: lumiinsight
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lumiinsight}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lumiinsight-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    volumes:
      - lumi-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulumiinsight", "-plumiinsight"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: lumi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - lumi-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: lumi-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - lumi-qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: lumi-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-lumiinsight}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-lumiinsight-minio}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - lumi-minio-data:/data

volumes:
  lumi-mysql-data:
  lumi-redis-data:
  lumi-qdrant-data:
  lumi-minio-data:
